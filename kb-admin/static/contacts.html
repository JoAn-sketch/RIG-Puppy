<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>联系人管理 · 噜噜后端</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
header { background: #1f2937; color: #fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin: 0; font-size: 18px; font-weight: 500; }
header a { color: #9ca3af; text-decoration: none; font-size: 13px; margin-left: 16px; }
header a:hover { color: #fff; }
main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
h2 { margin: 0 0 14px; font-size: 15px; color: #374151; border-left: 3px solid #3b82f6; padding-left: 10px; }
button { background: #3b82f6; color: #fff; border: 0; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
button:hover { background: #2563eb; }
button.danger { background: #ef4444; }
button.danger:hover { background: #dc2626; }
button.ghost { background: #fff; color: #374151; border: 1px solid #d1d5db; }
button.success { background: #22c55e; }
button.success:hover { background: #16a34a; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
input, textarea, select { font-size: 13px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; outline: none; width: 100%; background: #fff; }
input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
th { background: #f9fafb; font-weight: 500; color: #6b7280; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: #9ca3af; font-size: 12px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #dcfce7; color: #166534; }
.tag.gray { background: #e5e7eb; color: #4b5563; }
.tag.warn { background: #fef3c7; color: #92400e; }
.empty { color: #9ca3af; padding: 30px; text-align: center; }
.form-grid { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 10px 12px; align-items: center; }
.form-grid label { color: #6b7280; font-size: 13px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal.show { display: flex; }
.modal-box { background: #fff; border-radius: 8px; padding: 24px; max-width: 720px; width: 90%; max-height: 85vh; overflow: auto; }
.modal-box h3 { margin: 0 0 16px; font-size: 16px; color: #374151; }
.hint { background: #eff6ff; border-left: 3px solid #3b82f6; padding: 8px 12px; font-size: 12px; color: #1e40af; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>🐾 噜噜管理后台</h1>
  <div>
    <a href="/">📚 后端</a>
    <a href="/contacts">👥 联系人</a>
    <a href="/templates">📨 消息模板</a>
    <a href="/message-log">📋 发送日志</a>
    <a href="/reminders">⏰ 提醒计划</a>
    <a href="/monitor">📊 系统监控</a>
    <a href="/prompt">📝 Prompt</a>
    <a href="/portrait">🧑 画像</a>
    <a href="/mood">😊 情绪</a>
    <a href="/actions">🐕 动作</a>
    <a href="/llm-logs" style="color:#60a5fa">🔍 LLM日志</a>
    <a href="/debug">🔧 调试</a>
    <a href="/settings">⚙️ 设置</a>
    <a href="/iot" style="color:#34d399">🏠 家居</a>
    <a href="/health" style="color:#f472b6">🏥 健康</a>
    <a href="/dingyi-models" style="color:#34d399">🤖 模型切换</a>
    <a href="/dingyi-chat" style="color:#f59e0b">💬 对话模拟</a>
    <a href="http://122.51.155.114:8002" style="color:#fbbf24">🖥 主控台</a>
  </div>
</header>
<main>
  <div class="card">
    <h2>筛选</h2>
    <div class="row">
      <span class="muted">智能体:</span>
      <select id="agentSelect" style="max-width:240px" onchange="loadContacts()">
        <option value="">全部</option>
      </select>
      <button onclick="openAdd()">+ 新增联系人</button>
      <button class="ghost" onclick="loadContacts()">刷新</button>
    </div>
  </div>

  <div class="card">
    <h2>联系人列表</h2>
    <table id="contactsTable">
      <thead><tr>
        <th>ID</th><th>智能体</th><th>昵称</th><th>关系</th><th>手机号</th>
        <th>WxPusher UID</th><th>偏好</th><th>启用</th><th>操作</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<div class="modal" id="editModal" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 id="modalTitle">新增联系人</h3>
    <div class="hint">
      手机号或 WxPusher UID 至少填一个。偏好 auto=有 UID 优先微信，否则短信；both=两个通道都发。
    </div>
    <div class="form-grid">
      <label>智能体 *</label>
      <select id="f_agent_id"></select>
      <label>昵称 *</label>
      <input id="f_nickname" placeholder="大儿子 / 小芳 / 奶奶">

      <label>关系</label>
      <input id="f_relation" placeholder="儿子 / 女儿 / 母亲（可选）">
      <label>手机号</label>
      <input id="f_phone" placeholder="13800138000（中国大陆，国内无须 +86）">

      <label>WxPusher UID</label>
      <input id="f_wxpusher_uid" placeholder="UID_xxx（子女扫码后获得）">
      <label>偏好</label>
      <select id="f_channel_pref">
        <option value="auto">auto（默认，有微信优先微信）</option>
        <option value="wechat">仅微信</option>
        <option value="sms">仅短信</option>
        <option value="both">两个都发</option>
      </select>

      <label>备注</label>
      <input id="f_remark" placeholder="可选">
      <label>启用</label>
      <select id="f_enabled">
        <option value="1">启用</option>
        <option value="0">停用</option>
      </select>
    </div>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="ghost" onclick="closeModal()">取消</button>
      <button class="success" onclick="saveContact()">保存</button>
    </div>
  </div>
</div>

<script>
let agents = [];
let editingId = null;

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  const t = await r.text();
  try { return JSON.parse(t); } catch(e) { return {raw: t, status: r.status}; }
}

function agentName(id) {
  const a = agents.find(x => x.id === id);
  return a ? a.agent_name : id.slice(0, 8) + "...";
}

async function loadAgents() {
  const d = await api("/api/msg/agents");
  agents = d.list || [];
  const sel = document.getElementById("agentSelect");
  const fsel = document.getElementById("f_agent_id");
  sel.innerHTML = '<option value="">全部</option>';
  fsel.innerHTML = "";
  for (const a of agents) {
    sel.insertAdjacentHTML("beforeend", `<option value="${a.id}">${a.agent_name}</option>`);
    fsel.insertAdjacentHTML("beforeend", `<option value="${a.id}">${a.agent_name}</option>`);
  }
}

async function loadContacts() {
  const agent_id = document.getElementById("agentSelect").value;
  const q = agent_id ? `?agent_id=${agent_id}` : "";
  const d = await api("/api/msg/contacts" + q);
  const list = d.list || [];
  const tb = document.querySelector("#contactsTable tbody");
  tb.innerHTML = "";
  if (list.length === 0) {
    tb.innerHTML = '<tr><td colspan="9" class="empty">还没联系人，点 + 新增吧</td></tr>';
    return;
  }
  for (const c of list) {
    const tr = document.createElement("tr");
    const en = c.enabled == 1 ? '<span class="tag">启用</span>' : '<span class="tag gray">停用</span>';
    tr.innerHTML = `
      <td><code>${c.id}</code></td>
      <td><span class="muted">${agentName(c.agent_id)}</span></td>
      <td><b>${c.nickname||""}</b></td>
      <td>${c.relation||"-"}</td>
      <td>${c.phone||'<span class="muted">-</span>'}</td>
      <td><code style="font-size:11px">${c.wxpusher_uid||"-"}</code></td>
      <td>${c.channel_pref||"auto"}</td>
      <td>${en}</td>
      <td>
        <button class="ghost" onclick='openEdit(${JSON.stringify(c)})'>编辑</button>
        <button class="danger" onclick="delContact(${c.id},'${(c.nickname||"").replace(/'/g,"")}')">删除</button>
      </td>`;
    tb.appendChild(tr);
  }
}

function openAdd() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "新增联系人";
  document.getElementById("f_nickname").value = "";
  document.getElementById("f_relation").value = "";
  document.getElementById("f_phone").value = "";
  document.getElementById("f_wxpusher_uid").value = "";
  document.getElementById("f_channel_pref").value = "auto";
  document.getElementById("f_remark").value = "";
  document.getElementById("f_enabled").value = "1";
  const cur = document.getElementById("agentSelect").value;
  if (cur) document.getElementById("f_agent_id").value = cur;
  document.getElementById("f_agent_id").disabled = false;
  document.getElementById("editModal").classList.add("show");
}

function openEdit(c) {
  editingId = c.id;
  document.getElementById("modalTitle").textContent = "编辑联系人 #" + c.id;
  document.getElementById("f_agent_id").value = c.agent_id;
  document.getElementById("f_agent_id").disabled = true;
  document.getElementById("f_nickname").value = c.nickname || "";
  document.getElementById("f_relation").value = c.relation || "";
  document.getElementById("f_phone").value = c.phone || "";
  document.getElementById("f_wxpusher_uid").value = c.wxpusher_uid || "";
  document.getElementById("f_channel_pref").value = c.channel_pref || "auto";
  document.getElementById("f_remark").value = c.remark || "";
  document.getElementById("f_enabled").value = String(c.enabled == 1 ? 1 : 0);
  document.getElementById("editModal").classList.add("show");
}

function closeModal(e) {
  if (e && e.target.id !== "editModal") return;
  document.getElementById("editModal").classList.remove("show");
}

async function saveContact() {
  const body = {
    agent_id: document.getElementById("f_agent_id").value,
    nickname: document.getElementById("f_nickname").value.trim(),
    relation: document.getElementById("f_relation").value.trim(),
    phone: document.getElementById("f_phone").value.trim(),
    wxpusher_uid: document.getElementById("f_wxpusher_uid").value.trim(),
    channel_pref: document.getElementById("f_channel_pref").value,
    remark: document.getElementById("f_remark").value.trim(),
    enabled: document.getElementById("f_enabled").value === "1",
  };
  if (!body.agent_id || !body.nickname) {
    alert("智能体和昵称必填"); return;
  }
  if (!body.phone && !body.wxpusher_uid) {
    if (!confirm("手机号和微信 UID 都没填，这个联系人将不可发送。继续？")) return;
  }
  const url = editingId ? `/api/msg/contacts/${editingId}` : "/api/msg/contacts";
  const method = editingId ? "PUT" : "POST";
  const r = await api(url, {
    method, headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body),
  });
  if (r.ok) {
    closeModal();
    loadContacts();
  } else {
    alert("保存失败: " + JSON.stringify(r));
  }
}

async function delContact(id, name) {
  if (!confirm(`删除联系人「${name}」?(发送日志会保留)`)) return;
  await api(`/api/msg/contacts/${id}`, {method:"DELETE"});
  loadContacts();
}

(async () => {
  await loadAgents();
  await loadContacts();
})();
</script>
<script src="/shared-nav.js"></script>
</body>
</html>
