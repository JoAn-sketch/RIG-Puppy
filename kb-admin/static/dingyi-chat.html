<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>丁一锅对话模拟 · 噜噜</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
header { background: #1f2937; color: #fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin: 0; font-size: 18px; font-weight: 500; }
header a { color: #9ca3af; text-decoration: none; font-size: 13px; margin-left: 16px; }
header a:hover { color: #fff; }
main { max-width: 1180px; margin: 24px auto; padding: 0 16px; display:grid; grid-template-columns: 320px 1fr; gap: 20px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 18px; }
h2 { margin: 0 0 14px; font-size: 15px; color: #374151; border-left: 3px solid #10b981; padding-left: 10px; }
.meta { display:grid; gap: 10px; }
.meta-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; }
.label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.value { font-size: 13px; color: #111827; word-break: break-all; white-space: pre-wrap; }
.muted { color: #6b7280; font-size: 12px; }
.chat-shell { display:flex; flex-direction:column; min-height: 72vh; }
.chat-log { flex:1; overflow:auto; background: linear-gradient(180deg, #eefbf5 0%, #f8fafc 100%); border: 1px solid #dbeafe; border-radius: 14px; padding: 18px; }
.msg { display:flex; margin-bottom: 12px; }
.msg.user { justify-content:flex-end; }
.msg-wrap { max-width: 78%; display:flex; flex-direction:column; gap: 6px; align-items:flex-start; }
.msg.user .msg-wrap { align-items:flex-end; }
.bubble { max-width: 78%; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant .bubble { background: #fff; color: #111827; border: 1px solid #d1fae5; border-bottom-left-radius: 4px; }
.scene-pill { display:inline-flex; gap: 8px; align-items:center; max-width: 100%; padding: 6px 10px; border-radius: 999px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-size: 12px; line-height: 1.2; white-space: normal; word-break: break-word; }
.scene-pill .risk { color: #b45309; }
.scene-pill .confidence { color: #475569; }
.state-panel { max-width: 78%; background: #f8fafc; border: 1px solid #dbeafe; border-radius: 12px; padding: 12px 14px; color: #0f172a; font-size: 12px; line-height: 1.6; }
.state-title { font-weight: 700; color: #0369a1; margin-bottom: 8px; }
.state-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.state-item { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; }
.state-item .label { display:block; font-size: 11px; color: #64748b; margin-bottom: 2px; }
.state-item .value { font-size: 12px; color: #0f172a; word-break: break-word; }
.state-panel.plan { border-color: #c7d2fe; background: #f8faff; }
.state-panel.plan .state-title { color: #4338ca; }
.state-panel.rewrite { border-color: #fde68a; background: #fffbeb; }
.state-panel.rewrite .state-title { color: #b45309; }
.composer { margin-top: 14px; display:grid; gap: 10px; }
textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid #d1d5db; border-radius: 12px; padding: 12px 14px; font-size: 14px; outline: none; }
textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.row { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; }
button { background: #2563eb; color:#fff; border:0; border-radius: 8px; padding: 10px 16px; font-size: 13px; cursor:pointer; }
button:hover { background:#1d4ed8; }
button.secondary { background:#374151; }
button.secondary:hover { background:#1f2937; }
button:disabled { opacity:.5; cursor:not-allowed; }
.empty { color:#9ca3af; text-align:center; padding:80px 12px; font-size:14px; }
#toast { position: fixed; bottom: 26px; right: 26px; background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; z-index: 999; max-width: 520px; }
#toast.show { opacity: 1; transform: translateY(0); }
#toast.error { background: #dc2626; }
@media (max-width: 920px) {
  main { grid-template-columns: 1fr; }
  .chat-shell { min-height: auto; }
  .state-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>丁一锅对话模拟</h1>
  <div>
    <a href="/">📚 后端</a>
    <a href="/contacts">👥 联系人</a>
    <a href="/templates">📨 消息模板</a>
    <a href="/message-log">📋 发送日志</a>
    <a href="/reminders">⏰ 提醒计划</a>
    <a href="/monitor">📊 系统监控</a>
    <a href="/prompt">📝 Prompt</a>
    <a href="/portrait">🧑 画像</a>
    <a href="/mood">😊 情绪</a>
    <a href="/actions">🐕 动作</a>
    <a href="/llm-logs" style="color:#60a5fa">🔍 LLM日志</a>
    <a href="/debug">🔧 调试</a>
    <a href="/settings">⚙️ 设置</a>
    <a href="/iot" style="color:#34d399">🏠 家居</a>
    <a href="/health" style="color:#f472b6">🏥 健康</a>
    <a href="/kid" style="color:#fbbf24">🧒 儿童</a>
    <a href="/dingyi-models" style="color:#34d399">🤖 模型切换</a>
    <a href="/dingyi-chat" style="color:#f59e0b">💬 对话模拟</a>
    <a href="http://122.51.155.114:8002" style="color:#fbbf24">🖥 主控台</a>
  </div>
</header>

<main>
  <div class="card">
    <h2>当前配置</h2>
    <div id="meta" class="meta">
      <div class="meta-item"><div class="label">状态</div><div class="value">加载中...</div></div>
    </div>
  </div>

  <div class="card chat-shell">
    <h2>文字模拟</h2>
    <div class="muted" style="margin-bottom:12px">这里会把文本直接送进机器人主链路，跳过语音识别，但复用 scene router、dialogue state、intent、memory、tools 与真实回复链。</div>
    <div id="chatLog" class="chat-log">
      <div class="empty">输入一句话，模拟和机器狗对话。</div>
    </div>
    <div class="composer">
      <textarea id="inputText" placeholder="例如：今天有点累，你陪我聊聊天"></textarea>
      <div class="row">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
        <button class="secondary" onclick="clearChat()">清空上下文</button>
        <span class="muted" id="usageText"></span>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
let history = [];
let sending = false;
let sessionKey = createSessionKey();
let runtimeDeviceId = '';
let currentRuntimeMode = '';

function createSessionKey() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') {
    return window.crypto.randomUUID();
  }
  return 'sess-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function toast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = (isError ? "error " : "") + "show";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.className = ""; }, 2600);
}

function renderMeta(data) {
  runtimeDeviceId = String(data.runtime_device_id || '').trim();
  const meta = document.getElementById("meta");
  meta.innerHTML = `
    <div class="meta-item"><div class="label">Agent</div><div class="value">${esc(data.agent_name)}<br><span class="muted">${esc(data.agent_id)}</span></div></div>
    <div class="meta-item"><div class="label">模型配置</div><div class="value">${esc(data.llm_model_name)}<br><span class="muted">${esc(data.llm_model_id)}</span></div></div>
    <div class="meta-item"><div class="label">当前模型名</div><div class="value">${esc(data.model_name || "-")}</div></div>
    <div class="meta-item"><div class="label">Base URL</div><div class="value">${esc(data.base_url || "-")}</div></div>
    <div class="meta-item"><div class="label">API Key</div><div class="value">${data.has_api_key ? "已配置" : "未配置"}</div></div>
    <div class="meta-item"><div class="label">运行链路</div><div class="value">${esc(data.runtime_mode || "-")}<br><span class="muted">${esc(data.runtime_ws_base || "-")}</span></div></div>
    <div class="meta-item"><div class="label">目标设备</div><div class="value">${esc(runtimeDeviceId || "-")}</div></div>
    <div class="meta-item"><div class="label">System Prompt</div><div class="value">${esc((data.system_prompt || "").slice(0, 400) || "-")}${(data.system_prompt || "").length > 400 ? "\\n..." : ""}</div></div>
  `;
}

function renderChat() {
  const log = document.getElementById("chatLog");
  if (!history.length) {
    log.innerHTML = '<div class="empty">输入一句话，模拟和机器狗对话。</div>';
    return;
  }
  const sceneHtml = (scene) => {
    if (!scene || !scene.primary_scene) return '';
    const confidence = typeof scene.confidence === 'number' ? scene.confidence.toFixed(2) : '-';
    return `
      <div class="scene-pill">
        <span>${esc(scene.primary_scene)} / ${esc(scene.subscene || '-')}</span>
        <span class="risk">risk: ${esc(scene.risk_level || '-')}</span>
        <span class="confidence">conf: ${esc(confidence)}</span>
      </div>
    `;
  };
  const dialogueStateHtml = (dialogueState) => {
    if (!dialogueState || !dialogueState.control) return '';
    const control = dialogueState.control || {};
    const debug = dialogueState.debug || {};
    const state = dialogueState.state || {};
    const sceneState = state.scene_state || {};
    const phaseState = state.phase_state || {};
    const turnState = state.turn_state || {};
    return `
      <div class="state-panel">
        <div class="state-title">Dialogue State</div>
        <div class="state-grid">
          <div class="state-item"><span class="label">Phase</span><div class="value">${esc(control.current_phase || '-')}</div></div>
          <div class="state-item"><span class="label">Next Action</span><div class="value">${esc(control.next_action || '-')}</div></div>
          <div class="state-item"><span class="label">Reply Style</span><div class="value">${esc(control.reply_style || '-')}</div></div>
          <div class="state-item"><span class="label">Rule</span><div class="value">${esc(debug.matched_rule || '-')}</div></div>
          <div class="state-item"><span class="label">Transition</span><div class="value">${esc(debug.transition_reason || '-')}</div></div>
          <div class="state-item"><span class="label">Close Scene</span><div class="value">${esc(String(control.should_close_scene ?? false))}</div></div>
          <div class="state-item"><span class="label">Scene Turns</span><div class="value">${esc(sceneState.scene_turn_count ?? '-')}</div></div>
          <div class="state-item"><span class="label">Phase Turns</span><div class="value">${esc(phaseState.phase_turn_count ?? '-')}</div></div>
          <div class="state-item"><span class="label">Followups</span><div class="value">${esc(turnState.followup_count ?? '-')}</div></div>
          <div class="state-item"><span class="label">Ask Followup</span><div class="value">${esc(String(control.should_ask_followup ?? false))}</div></div>
        </div>
      </div>
    `;
  };
  const responsePlanHtml = (plan, source) => {
    if (!plan) return '';
    return `
      <div class="state-panel plan">
        <div class="state-title">Response Plan</div>
        <div class="state-grid">
          <div class="state-item"><span class="label">Source</span><div class="value">${esc(source || '-')}</div></div>
          <div class="state-item"><span class="label">Primary Action</span><div class="value">${esc(plan.primary_action || '-')}</div></div>
          <div class="state-item"><span class="label">Sentence Budget</span><div class="value">${esc(plan.sentence_budget ?? '-')}</div></div>
          <div class="state-item"><span class="label">Concept Budget</span><div class="value">${esc(plan.concept_budget ?? '-')}</div></div>
          <div class="state-item"><span class="label">Ask Followup</span><div class="value">${esc(String(plan.ask_followup ?? false))}</div></div>
          <div class="state-item"><span class="label">Allow Summary</span><div class="value">${esc(String(plan.allow_summary ?? false))}</div></div>
          <div class="state-item"><span class="label">Blocks</span><div class="value">${esc((plan.content_blocks || []).join(', ') || '-')}</div></div>
          <div class="state-item"><span class="label">Style Tags</span><div class="value">${esc((plan.style_tags || []).join(', ') || '-')}</div></div>
        </div>
      </div>
    `;
  };
  const responseRewriteHtml = (rewrite) => {
    if (!rewrite) return '';
    const flags = rewrite.quality_flags || {};
    return `
      <div class="state-panel rewrite">
        <div class="state-title">Response Rewrite</div>
        <div class="state-grid">
          <div class="state-item"><span class="label">Actions</span><div class="value">${esc((rewrite.rewrite_actions || []).join(', ') || 'none')}</div></div>
          <div class="state-item"><span class="label">Raw Reply</span><div class="value">${esc(rewrite.raw_reply || '-')}</div></div>
          <div class="state-item"><span class="label">too_long</span><div class="value">${esc(String(flags.too_long ?? false))}</div></div>
          <div class="state-item"><span class="label">has_summary</span><div class="value">${esc(String(flags.has_summary ?? false))}</div></div>
          <div class="state-item"><span class="label">has_followup</span><div class="value">${esc(String(flags.has_followup ?? false))}</div></div>
          <div class="state-item"><span class="label">multi_concept</span><div class="value">${esc(String(flags.multi_concept ?? false))}</div></div>
        </div>
      </div>
    `;
  };
  log.innerHTML = history.map(item => `
    <div class="msg ${item.role}">
      <div class="msg-wrap">
        ${item.role === 'user' ? sceneHtml(item.scene) : ''}
        ${item.role === 'user' ? dialogueStateHtml(item.dialogue_state) : ''}
        ${item.role === 'user' ? responsePlanHtml(item.response_plan, item.debug_source) : ''}
        ${item.role === 'assistant' ? responseRewriteHtml(item.response_rewrite) : ''}
        <div class="bubble">${esc(item.content)}</div>
      </div>
    </div>
  `).join("");
  log.scrollTop = log.scrollHeight;
}

async function loadConfig() {
  try {
    const res = await fetch('/api/dingyi-chat/config');
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    renderMeta(data);
  } catch (e) {
    document.getElementById('meta').innerHTML = `<div class="meta-item"><div class="label">错误</div><div class="value">${esc(String(e))}</div></div>`;
    toast('加载配置失败: ' + e, true);
  }
}

async function clearChat() {
  const oldSessionKey = sessionKey;
  sessionKey = createSessionKey();
  history = [];
  document.getElementById('usageText').textContent = '';
  renderChat();
  try {
    await fetch('/api/dingyi-chat/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_key: oldSessionKey, device_id: runtimeDeviceId })
    });
  } catch (e) {
    console.warn('reset session failed', e);
  }
}

async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('inputText');
  const text = input.value.trim();
  if (!text) return;
  sending = true;
  document.getElementById('sendBtn').disabled = true;

  history.push({ role: 'user', content: text });
  renderChat();
  input.value = '';

  try {
    const res = await fetch('/api/dingyi-chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, history: history.slice(0, -1), session_key: sessionKey, device_id: runtimeDeviceId })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    history[history.length - 1].scene = data.scene || null;
    history[history.length - 1].dialogue_state = data.dialogue_state || null;
    history[history.length - 1].response_plan = data.response_plan || null;
    history[history.length - 1].debug_source = data.debug_source || null;
    currentRuntimeMode = String(data.runtime_mode || '').trim();
    history.push({
      role: 'assistant',
      content: data.reply || '(空回复)',
      response_rewrite: data.response_rewrite || null
    });
    document.getElementById('usageText').textContent =
      `链路: ${data.model || '-'} · mode: ${currentRuntimeMode || '-'} · debug: ${data.debug_source || '-'}${data.usage && data.usage.total_tokens ? ' · total_tokens: ' + data.usage.total_tokens : ''}`;
    renderChat();
    toast(
      currentRuntimeMode === 'live'
        ? '当前使用机器人在线 live runtime'
        : '机器人离线，已降级到 text-only runtime',
      false
    );
  } catch (e) {
    history.push({ role: 'assistant', content: '请求失败：' + String(e) });
    renderChat();
    toast('发送失败: ' + e, true);
  } finally {
    sending = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

document.getElementById('inputText').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') sendMessage();
});

loadConfig();
renderChat();
</script>
<script src="/shared-nav.js"></script>
</body>
</html>
