<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>情绪趋势 · 噜噜后端</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
header { background: #1f2937; color: #fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin: 0; font-size: 18px; font-weight: 500; }
header a { color: #9ca3af; text-decoration: none; font-size: 13px; margin-left: 16px; }
header a:hover { color: #fff; }
main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
.card h3 { margin: 0 0 12px; font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; }
button { background: #3b82f6; color: #fff; border: 0; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
button:hover { background: #2563eb; }
button.ghost { background: #fff; color: #374151; border: 1px solid #d1d5db; }
select { background: #fff; color: #222; border: 1px solid #d1d5db; padding: 6px 10px; border-radius: 5px; font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; }
th { background: #f9fafb; font-weight: 500; color: #6b7280; }
.muted { color: #9ca3af; font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.tag.ok { background: #dcfce7; color: #166534; }
.tag.warn { background: #fef3c7; color: #92400e; }
.tag.err { background: #fee2e2; color: #991b1b; }
.tag.info { background: #e0e7ff; color: #4338ca; }
.empty { color: #9ca3af; padding: 20px; text-align: center; }
.chart-row { display: flex; gap: 4px; align-items: flex-end; height: 60px; margin-top: 8px; }
.chart-bar { min-width: 18px; background: #3b82f6; border-radius: 3px 3px 0 0; position: relative; transition: height .3s; }
.chart-bar:hover { background: #60a5fa; }
.chart-bar .tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; border: 1px solid #374151; padding: 4px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10; }
.chart-bar:hover .tip { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
.metric { font-size: 24px; font-weight: 600; color: #1f2937; }
.metric small { font-size: 13px; color: #9ca3af; font-weight: 400; }
.kw-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.kw { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🐾 噜噜管理后台</h1>
  <div>
    <a href="/">📚 后端</a>
    <a href="/contacts">👥 联系人</a>
    <a href="/templates">📨 消息模板</a>
    <a href="/message-log">📋 发送日志</a>
    <a href="/reminders">⏰ 提醒计划</a>
    <a href="/monitor">📊 系统监控</a>
    <a href="/prompt">📝 Prompt</a>
    <a href="/portrait">🧑 画像</a>
    <a href="/mood">😊 情绪</a>
    <a href="/actions">🐕 动作</a>
    <a href="/llm-logs" style="color:#60a5fa">🔍 LLM日志</a>
    <a href="/debug">🔧 调试</a>
    <a href="/settings">⚙️ 设置</a>
    <a href="/iot" style="color:#34d399">🏠 家居</a>
    <a href="/health" style="color:#f472b6">🏥 健康</a>
    <a href="/voiceprint" style="color:#a78bfa">🎤 声纹</a>
    <a href="/dingyi-models" style="color:#34d399">🤖 模型切换</a>
    <a href="/dingyi-chat" style="color:#f59e0b">💬 对话模拟</a>
    <a href="http://122.51.155.114:8002" style="color:#fbbf24">🖥 主控台</a>
  </div>
</header>
<main>
  <div class="card">
    <div class="row">
      <select id="agentSelect" onchange="load()">
        <option value="">-- 选择智能体 --</option>
      </select>
      <select id="daysSelect" onchange="load()">
        <option value="7">近 7 天</option>
        <option value="14">近 14 天</option>
        <option value="30" selected>近 30 天</option>
      </select>
      <button onclick="load()">刷新</button>
    </div>
  </div>

  <div class="grid" id="summaryGrid" style="display:none">
    <div class="card">
      <h3>日均对话</h3>
      <div class="metric" id="avgMsgs">-</div>
    </div>
    <div class="card">
      <h3>日均字数</h3>
      <div class="metric" id="avgChars">-</div>
    </div>
    <div class="card">
      <h3>消极命中总计</h3>
      <div class="metric" id="totalNeg">-</div>
    </div>
    <div class="card">
      <h3>孤独命中总计</h3>
      <div class="metric" id="totalLone">-</div>
    </div>
  </div>

  <div class="card" id="chartCard" style="display:none">
    <h3>每日对话量</h3>
    <div class="chart-row" id="msgChart"></div>
    <h3 style="margin-top:18px">每日消极信号</h3>
    <div class="chart-row" id="negChart"></div>
  </div>

  <div class="card" id="tableCard" style="display:none">
    <h3>明细</h3>
    <table id="dataTable">
      <thead><tr>
        <th>日期</th><th>用户消息</th><th>均字数</th>
        <th>消极</th><th>沉默</th><th>孤独</th>
        <th>活跃时段</th><th>命中词</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
async function api(path) {
  const r = await fetch(path);
  return r.json();
}

async function loadAgents() {
  const d = await api("/api/msg/agents");
  const sel = document.getElementById("agentSelect");
  sel.innerHTML = '<option value="">-- 选择智能体 --</option>';
  for (const a of (d.list || [])) {
    sel.insertAdjacentHTML("beforeend", `<option value="${a.id}">${a.agent_name}</option>`);
  }
  if (d.list && d.list.length === 1) {
    sel.value = d.list[0].id;
    load();
  }
}

function moodTag(neg, sil, lone) {
  const total = neg + sil + lone;
  if (total === 0) return '<span class="tag ok">正常</span>';
  if (total <= 2) return '<span class="tag warn">轻微</span>';
  return '<span class="tag err">关注</span>';
}

function renderBar(container, data, key, color) {
  const el = document.getElementById(container);
  el.innerHTML = "";
  if (!data.length) return;
  const max = Math.max(...data.map(d => d[key]), 1);
  for (const d of data) {
    const h = Math.max(2, (d[key] / max) * 56);
    const bar = document.createElement("div");
    bar.className = "chart-bar";
    bar.style.height = h + "px";
    bar.style.flex = "1";
    if (color) bar.style.background = color;
    bar.innerHTML = `<span class="tip">${d.stat_date.slice(5)}: ${d[key]}</span>`;
    el.appendChild(bar);
  }
}

async function load() {
  const agent = document.getElementById("agentSelect").value;
  const days = document.getElementById("daysSelect").value;
  if (!agent) return;

  const d = await api(`/api/mood?agent_id=${agent}&days=${days}`);
  const list = d.list || [];

  if (!list.length) {
    document.getElementById("summaryGrid").style.display = "none";
    document.getElementById("chartCard").style.display = "none";
    document.getElementById("tableCard").style.display = "none";
    return;
  }

  document.getElementById("summaryGrid").style.display = "grid";
  document.getElementById("chartCard").style.display = "block";
  document.getElementById("tableCard").style.display = "block";

  // Summary
  const totalDays = list.length;
  const sumMsgs = list.reduce((s, r) => s + r.user_msg_count, 0);
  const sumChars = list.reduce((s, r) => s + r.user_total_chars, 0);
  const sumNeg = list.reduce((s, r) => s + r.negative_hits, 0);
  const sumLone = list.reduce((s, r) => s + r.loneliness_hits, 0);

  document.getElementById("avgMsgs").innerHTML = `${Math.round(sumMsgs/totalDays)}<small> 条/天</small>`;
  document.getElementById("avgChars").innerHTML = `${Math.round(sumChars/Math.max(sumMsgs,1))}<small> 字/条</small>`;
  document.getElementById("totalNeg").innerHTML = `${sumNeg}<small> 次</small>`;
  document.getElementById("totalLone").innerHTML = `${sumLone}<small> 次</small>`;

  // Charts
  renderBar("msgChart", list, "user_msg_count", "#3b82f6");
  renderBar("negChart", list, "negative_hits", "#ef4444");

  // Table
  const tb = document.querySelector("#dataTable tbody");
  tb.innerHTML = "";
  for (const r of [...list].reverse()) {
    const kws = r.matched_keywords ? JSON.parse(r.matched_keywords) : [];
    const kwHtml = kws.map(k => `<span class="kw">${k}</span>`).join("");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.stat_date}</td>
      <td>${r.user_msg_count}</td>
      <td>${r.avg_user_chars}</td>
      <td>${r.negative_hits > 0 ? '<span class="tag err">'+r.negative_hits+'</span>' : '0'}</td>
      <td>${r.silence_word_hits > 0 ? '<span class="tag warn">'+r.silence_word_hits+'</span>' : '0'}</td>
      <td>${r.loneliness_hits > 0 ? '<span class="tag warn">'+r.loneliness_hits+'</span>' : '0'}</td>
      <td>${r.hours_active}h (${r.first_chat_at ? r.first_chat_at.slice(11,16) : '-'} ~ ${r.last_chat_at ? r.last_chat_at.slice(11,16) : '-'})</td>
      <td><div class="kw-list">${kwHtml || '<span class="muted">无</span>'}</div></td>`;
    tb.appendChild(tr);
  }
}

loadAgents();
</script>
<script src="/shared-nav.js"></script>
</body>
</html>
