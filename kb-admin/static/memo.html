<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>备忘录 · 噜噜</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
header { background: #1f2937; color: #fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin: 0; font-size: 18px; font-weight: 500; }
header a { color: #9ca3af; text-decoration: none; font-size: 13px; margin-left: 16px; }
header a:hover { color: #fff; }
main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
h2 { margin: 0 0 14px; font-size: 15px; color: #374151; border-left: 3px solid #3b82f6; padding-left: 10px; }
button { background: #3b82f6; color: #fff; border: 0; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
button:hover { background: #2563eb; }
button.danger { background: #ef4444; }
button.danger:hover { background: #dc2626; }
input, textarea { font-size: 13px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; outline: none; width: 100%; }
input:focus, textarea:focus { border-color: #3b82f6; }
.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; background: #f9fafb; color: #6b7280; font-weight: 500; border-bottom: 1px solid #e5e7eb; }
td { padding: 10px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
.id-badge { display: inline-block; background: #e0e7ff; color: #3730a3; border-radius: 4px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
.content-cell { color: #6b7280; max-width: 400px; word-break: break-all; }
.time-cell { color: #9ca3af; font-size: 12px; white-space: nowrap; }
.empty { text-align: center; color: #9ca3af; padding: 32px; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🐾 噜噜管理后台</h1>
  <div>
    <a href="/">📚 后端</a>
    <a href="/contacts">👥 联系人</a>
    <a href="/templates">📨 消息模板</a>
    <a href="/message-log">📋 发送日志</a>
    <a href="/reminders">⏰ 提醒计划</a>
    <a href="/monitor">📊 系统监控</a>
    <a href="/prompt">📝 Prompt</a>
    <a href="/modes">🎭 模式管理</a>
    <a href="/portrait">🧑 画像</a>
    <a href="/mood">😊 情绪</a>
    <a href="/actions">🐕 动作</a>
    <a href="/memo">📝 备忘录</a>
    <a href="/llm-logs" style="color:#60a5fa">🔍 LLM日志</a>
    <a href="/debug">🔧 调试</a>
    <a href="/settings">⚙️ 设置</a>
    <a href="/iot" style="color:#34d399">🏠 家居</a>
    <a href="/health" style="color:#f472b6">🏥 健康</a>
    <a href="/voiceprint" style="color:#a78bfa">🎤 声纹</a>
    <a href="/dingyi-models" style="color:#34d399">🤖 模型切换</a>
    <a href="http://122.51.155.114:8002" style="color:#fbbf24">🖥 主控台</a>
  </div>
</header>
<main>

  <div class="card">
    <h2>新建备忘</h2>
    <div class="form-row">
      <label>标题 *</label>
      <input id="inTitle" placeholder="简短概括，例如：买药、复诊时间…" maxlength="128">
    </div>
    <div class="form-row">
      <label>详细内容（可选）</label>
      <textarea id="inContent" rows="3" placeholder="补充说明…"></textarea>
    </div>
    <button onclick="createMemo()">➕ 添加备忘</button>
  </div>

  <div class="card">
    <h2>备忘录列表 <span id="countBadge" style="font-size:12px;color:#9ca3af;font-weight:400;margin-left:6px;"></span></h2>
    <div id="memoTable"><div class="empty">加载中…</div></div>
  </div>

</main>
<div class="toast" id="toast"></div>

<script>
const AGENT_ID = "1822c2babf1b44cca6b25d0bdebc796f";

function toast(msg, err) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = err ? "#ef4444" : "#1f2937";
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

async function loadMemos() {
  try {
    const r = await fetch(`/api/memo?agent_id=${AGENT_ID}`);
    const data = await r.json();
    if (data.error) { toast(data.error, true); return; }
    renderTable(data);
  } catch(e) { toast("加载失败: " + e, true); }
}

function renderTable(rows) {
  const badge = document.getElementById("countBadge");
  badge.textContent = rows.length ? `共 ${rows.length} 条` : "";
  const el = document.getElementById("memoTable");
  if (!rows.length) {
    el.innerHTML = '<div class="empty">暂无备忘录</div>';
    return;
  }
  let html = '<table><thead><tr><th>编号</th><th>标题</th><th>内容</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
  for (const m of rows) {
    html += `<tr>
      <td><span class="id-badge">#${m.id}</span></td>
      <td><strong>${esc(m.title)}</strong></td>
      <td class="content-cell">${esc(m.content || "")}</td>
      <td class="time-cell">${(m.created_at||"").replace("T"," ").slice(0,16)}</td>
      <td><button class="danger" onclick="deleteMemo(${m.id})">删除</button></td>
    </tr>`;
  }
  html += "</tbody></table>";
  el.innerHTML = html;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function createMemo() {
  const title = document.getElementById("inTitle").value.trim();
  const content = document.getElementById("inContent").value.trim();
  if (!title) { toast("标题不能为空", true); return; }
  try {
    const r = await fetch("/api/memo", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({agent_id: AGENT_ID, title, content})
    });
    const data = await r.json();
    if (data.error) { toast(data.error, true); return; }
    toast(`备忘录 #${data.id} 已创建`);
    document.getElementById("inTitle").value = "";
    document.getElementById("inContent").value = "";
    loadMemos();
  } catch(e) { toast("创建失败: " + e, true); }
}

async function deleteMemo(id) {
  if (!confirm(`确认删除备忘录 #${id}？`)) return;
  try {
    const r = await fetch(`/api/memo/${id}?agent_id=${AGENT_ID}`, {method: "DELETE"});
    const data = await r.json();
    if (data.error) { toast(data.error, true); return; }
    toast(`备忘录 #${id} 已删除`);
    loadMemos();
  } catch(e) { toast("删除失败: " + e, true); }
}

loadMemos();
</script>
</body>
</html>
