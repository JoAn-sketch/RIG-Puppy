<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>智能家居 · 噜噜</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
header { background: #1f2937; color: #fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin: 0; font-size: 18px; font-weight: 500; }
header a { color: #9ca3af; text-decoration: none; font-size: 13px; margin-left: 16px; }
header a:hover { color: #fff; }
main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
h2 { margin: 0 0 14px; font-size: 15px; color: #374151; border-left: 3px solid #3b82f6; padding-left: 10px; }
button { background: #3b82f6; color: #fff; border: 0; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
button:hover { background: #2563eb; }
button.danger { background: #ef4444; }
button.danger:hover { background: #dc2626; }
button.ghost { background: #fff; color: #374151; border: 1px solid #d1d5db; }
button.success { background: #10b981; }
button.success:hover { background: #059669; }
input, select, textarea { font-size: 13px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; outline: none; }
.muted { color: #9ca3af; font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.tag.on { background: #dcfce7; color: #166534; }
.tag.off { background: #fee2e2; color: #991b1b; }
.tag.type { background: #ede9fe; color: #5b21b6; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; }
th { background: #f9fafb; font-weight: 500; color: #6b7280; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal.show { display: flex; }
.modal-box { background: #fff; border-radius: 8px; padding: 20px; max-width: 600px; width: 95%; max-height: 85vh; overflow: auto; }
.device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.device-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; transition: .2s; }
.device-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
.device-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.device-card .icon { font-size: 28px; }
.device-card .name { font-size: 15px; font-weight: 600; }
.device-card .room { font-size: 12px; color: #9ca3af; }
.device-card .state { font-size: 12px; color: #6b7280; margin-top: 8px; }
.device-card .actions { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.device-card .actions button { font-size: 12px; padding: 4px 10px; }
.toast { position: fixed; top: 20px; right: 20px; background: #10b981; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 200; display: none; }
.toast.error { background: #ef4444; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: #374151; margin-bottom: 4px; font-weight: 500; }
.form-group input, .form-group select { width: 100%; }
</style>
</head>
<body>
<header>
  <h1>🏠 智能家居</h1>
  <div>
    <a href="/">📚 后端</a>
    <a href="/contacts">👥 联系人</a>
    <a href="/templates">📨 消息模板</a>
    <a href="/message-log">📋 发送日志</a>
    <a href="/reminders">⏰ 提醒计划</a>
    <a href="/monitor">📊 系统监控</a>
    <a href="/prompt">📝 Prompt</a>
    <a href="/portrait">🧑 画像</a>
    <a href="/mood">😊 情绪</a>
    <a href="/actions">🐕 动作</a>
    <a href="/llm-logs" style="color:#60a5fa">🔍 LLM日志</a>
    <a href="/debug">🔧 调试</a>
    <a href="/settings">⚙️ 设置</a>
    <a href="/iot" style="color:#34d399">🏠 家居</a>
    <a href="/health" style="color:#f472b6">🏥 健康</a>
    <a href="/voiceprint" style="color:#a78bfa">🎤 声纹</a>
    <a href="/dingyi-models" style="color:#34d399">🤖 模型切换</a>
    <a href="/dingyi-chat" style="color:#f59e0b">💬 对话模拟</a>
    <a href="http://122.51.155.114:8002" style="color:#fbbf24">🖥 主控台</a>
  </div>
</header>
<main>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2>设备总览</h2>
      <div class="row">
        <button onclick="openAddModal()">➕ 添加设备</button>
        <button class="ghost" onclick="loadDevices()">刷新</button>
      </div>
    </div>
    <div id="deviceGrid" class="device-grid">
      <p class="muted">加载中...</p>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2>指令日志</h2>
      <div class="row">
        <button class="ghost" onclick="loadLogs()">刷新</button>
        <span class="muted">最近 50 条</span>
      </div>
    </div>
    <table id="logTable">
      <thead><tr><th>时间</th><th>设备</th><th>操作</th><th>参数</th><th>结果</th><th>来源</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

</main>

<!-- 添加/编辑设备 -->
<div class="modal" id="deviceModal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-box">
    <h3 id="modalTitle">添加设备</h3>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>设备ID (唯一标识)</label>
      <input id="fDeviceId" placeholder="如 living_room_light_01">
    </div>
    <div class="form-group">
      <label>设备名称</label>
      <input id="fDeviceName" placeholder="如 客厅主灯">
    </div>
    <div class="row" style="gap:12px;margin-bottom:12px">
      <div class="form-group" style="flex:1">
        <label>设备类型</label>
        <select id="fDeviceType">
          <option value="light">💡 灯</option>
          <option value="ac">❄️ 空调</option>
          <option value="curtain">🪟 窗帘</option>
          <option value="switch">🔌 开关</option>
          <option value="fan">🌀 风扇</option>
          <option value="sensor">📡 传感器</option>
          <option value="other">📦 其他</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>房间</label>
        <input id="fRoom" placeholder="如 客厅">
      </div>
    </div>
    <div class="row" style="gap:12px;margin-bottom:12px">
      <div class="form-group" style="flex:1">
        <label>通信协议</label>
        <select id="fProtocol">
          <option value="http">HTTP</option>
          <option value="mqtt">MQTT</option>
          <option value="tcp">TCP</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>设备地址</label>
        <input id="fEndpoint" placeholder="如 192.168.1.100:80">
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">
      <button class="ghost" onclick="document.getElementById('deviceModal').classList.remove('show')">取消</button>
      <button onclick="saveDevice()">保存</button>
    </div>
  </div>
</div>

<!-- 控制面板 -->
<div class="modal" id="controlModal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-box">
    <h3 id="controlTitle">设备控制</h3>
    <input type="hidden" id="controlDeviceId">
    <div id="controlPanel"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="ghost" onclick="document.getElementById('controlModal').classList.remove('show')">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var TYPE_ICON = {light:'💡',ac:'❄️',curtain:'🪟','switch':'🔌',fan:'🌀',sensor:'📡',other:'📦'};

function toast(msg, err) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (err ? ' error' : '');
  el.style.display = 'block';
  setTimeout(function(){ el.style.display = 'none'; }, 2500);
}

async function loadDevices() {
  var res = await fetch('/api/iot/devices');
  var data = await res.json();
  var grid = document.getElementById('deviceGrid');
  if (!data.length) {
    grid.innerHTML = '<p class="muted" style="text-align:center">暂无设备，点击"添加设备"开始</p>';
    return;
  }
  grid.innerHTML = data.map(function(d) {
    var icon = TYPE_ICON[d.device_type] || '📦';
    var state = {};
    try { if(d.state_json) state = JSON.parse(d.state_json); } catch(e){}
    var stateText = Object.keys(state).map(function(k){ return k+': '+state[k]; }).join(', ') || '无状态';
    var online = d.is_online ? '<span class="tag on">在线</span>' : '<span class="tag off">离线</span>';
    return '<div class="device-card">'
      + '<div class="top"><div>'
      + '<span class="icon">'+icon+'</span> '
      + '<span class="name">'+d.device_name+'</span> '
      + online
      + '</div><span class="tag type">'+(d.room||'未分配')+'</span></div>'
      + '<div class="muted">'+d.device_id+' · '+d.protocol+'://'+(d.endpoint||'-')+'</div>'
      + '<div class="state">状态: '+stateText+'</div>'
      + '<div class="muted">最后通信: '+(d.last_seen||'从未')+'</div>'
      + '<div class="actions">'
      + '<button class="success" onclick="openControl(\''+d.device_id+'\',\''+d.device_name+'\',\''+d.device_type+'\')">控制</button>'
      + '<button class="ghost" onclick="editDevice('+d.id+')">编辑</button>'
      + '<button class="danger" onclick="deleteDevice('+d.id+',\''+d.device_name+'\')">删除</button>'
      + '</div></div>';
  }).join('');
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = '添加设备';
  document.getElementById('editId').value = '';
  ['fDeviceId','fDeviceName','fRoom','fEndpoint'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('fDeviceType').value = 'light';
  document.getElementById('fProtocol').value = 'http';
  document.getElementById('fDeviceId').disabled = false;
  document.getElementById('deviceModal').classList.add('show');
}

async function editDevice(id) {
  var res = await fetch('/api/iot/devices/' + id);
  var d = await res.json();
  document.getElementById('modalTitle').textContent = '编辑设备';
  document.getElementById('editId').value = id;
  document.getElementById('fDeviceId').value = d.device_id;
  document.getElementById('fDeviceId').disabled = true;
  document.getElementById('fDeviceName').value = d.device_name;
  document.getElementById('fDeviceType').value = d.device_type;
  document.getElementById('fRoom').value = d.room || '';
  document.getElementById('fProtocol').value = d.protocol || 'http';
  document.getElementById('fEndpoint').value = d.endpoint || '';
  document.getElementById('deviceModal').classList.add('show');
}

async function saveDevice() {
  var editId = document.getElementById('editId').value;
  var body = {
    device_id: document.getElementById('fDeviceId').value.trim(),
    device_name: document.getElementById('fDeviceName').value.trim(),
    device_type: document.getElementById('fDeviceType').value,
    room: document.getElementById('fRoom').value.trim(),
    protocol: document.getElementById('fProtocol').value,
    endpoint: document.getElementById('fEndpoint').value.trim()
  };
  if (!body.device_id || !body.device_name) { toast('设备ID和名称不能为空', true); return; }
  var url = editId ? '/api/iot/devices/' + editId : '/api/iot/devices';
  var method = editId ? 'PUT' : 'POST';
  var res = await fetch(url, {method: method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  var data = await res.json();
  if (data.ok) {
    toast(editId ? '已更新' : '已添加');
    document.getElementById('deviceModal').classList.remove('show');
    loadDevices();
  } else {
    toast(data.error || '保存失败', true);
  }
}

async function deleteDevice(id, name) {
  if (!confirm('确定删除 "' + name + '"？')) return;
  var res = await fetch('/api/iot/devices/' + id, {method:'DELETE'});
  var data = await res.json();
  if (data.ok) { toast('已删除'); loadDevices(); loadLogs(); }
  else toast(data.error || '删除失败', true);
}

function openControl(deviceId, name, type) {
  document.getElementById('controlTitle').textContent = '控制 · ' + name;
  document.getElementById('controlDeviceId').value = deviceId;
  var panel = document.getElementById('controlPanel');
  var html = '';

  if (type === 'light') {
    html = '<div class="row" style="gap:12px;margin-bottom:12px">'
      + '<button class="success" onclick="sendCmd(\'turn_on\')">💡 开灯</button>'
      + '<button class="danger" onclick="sendCmd(\'turn_off\')">关灯</button></div>'
      + '<div class="form-group"><label>亮度 (0-100)</label>'
      + '<input type="range" id="ctrlBrightness" min="0" max="100" value="80" style="width:80%" '
      + 'oninput="document.getElementById(\'bVal\').textContent=this.value+\'%\'">'
      + ' <span id="bVal" class="muted">80%</span>'
      + ' <button class="ghost" style="margin-left:8px" onclick="sendCmd(\'set_brightness\',{brightness:+document.getElementById(\'ctrlBrightness\').value})">设置</button></div>'
      + '<div class="form-group"><label>色温 (2700K-6500K)</label>'
      + '<input type="range" id="ctrlCT" min="2700" max="6500" value="4000" step="100" style="width:80%" '
      + 'oninput="document.getElementById(\'ctVal\').textContent=this.value+\'K\'">'
      + ' <span id="ctVal" class="muted">4000K</span>'
      + ' <button class="ghost" style="margin-left:8px" onclick="sendCmd(\'set_color_temp\',{color_temp:+document.getElementById(\'ctrlCT\').value})">设置</button></div>';
  } else if (type === 'ac') {
    html = '<div class="row" style="gap:12px;margin-bottom:12px">'
      + '<button class="success" onclick="sendCmd(\'turn_on\')">开机</button>'
      + '<button class="danger" onclick="sendCmd(\'turn_off\')">关机</button></div>'
      + '<div class="form-group"><label>温度 (16-30°C)</label>'
      + '<input type="range" id="ctrlTemp" min="16" max="30" value="26" style="width:80%" '
      + 'oninput="document.getElementById(\'tVal\').textContent=this.value+\'°C\'">'
      + ' <span id="tVal" class="muted">26°C</span>'
      + ' <button class="ghost" style="margin-left:8px" onclick="sendCmd(\'set_temp\',{temperature:+document.getElementById(\'ctrlTemp\').value})">设置</button></div>'
      + '<div class="form-group"><label>模式</label><div class="row">'
      + '<button class="ghost" onclick="sendCmd(\'set_mode\',{mode:\'cool\'})">❄️ 制冷</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_mode\',{mode:\'heat\'})">🔥 制热</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_mode\',{mode:\'auto\'})">🔄 自动</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_mode\',{mode:\'dry\'})">💧 除湿</button>'
      + '</div></div>'
      + '<div class="form-group"><label>风速</label><div class="row">'
      + '<button class="ghost" onclick="sendCmd(\'set_fan_speed\',{speed:\'low\'})">低</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_fan_speed\',{speed:\'medium\'})">中</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_fan_speed\',{speed:\'high\'})">高</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_fan_speed\',{speed:\'auto\'})">自动</button>'
      + '</div></div>';
  } else if (type === 'curtain') {
    html = '<div class="row" style="gap:12px;margin-bottom:12px">'
      + '<button class="success" onclick="sendCmd(\'open\')">打开</button>'
      + '<button class="danger" onclick="sendCmd(\'close\')">关闭</button>'
      + '<button class="ghost" onclick="sendCmd(\'stop\')">停止</button></div>'
      + '<div class="form-group"><label>开合度 (0-100%)</label>'
      + '<input type="range" id="ctrlPos" min="0" max="100" value="50" style="width:80%" '
      + 'oninput="document.getElementById(\'pVal\').textContent=this.value+\'%\'">'
      + ' <span id="pVal" class="muted">50%</span>'
      + ' <button class="ghost" style="margin-left:8px" onclick="sendCmd(\'set_position\',{position:+document.getElementById(\'ctrlPos\').value})">设置</button></div>';
  } else if (type === 'fan') {
    html = '<div class="row" style="gap:12px;margin-bottom:12px">'
      + '<button class="success" onclick="sendCmd(\'turn_on\')">开</button>'
      + '<button class="danger" onclick="sendCmd(\'turn_off\')">关</button></div>'
      + '<div class="form-group"><label>风速</label><div class="row">'
      + '<button class="ghost" onclick="sendCmd(\'set_speed\',{speed:1})">1档</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_speed\',{speed:2})">2档</button>'
      + '<button class="ghost" onclick="sendCmd(\'set_speed\',{speed:3})">3档</button>'
      + '</div></div>'
      + '<div class="row"><button class="ghost" onclick="sendCmd(\'toggle_swing\')">摇头</button></div>';
  } else {
    html = '<div class="row" style="gap:12px;margin-bottom:12px">'
      + '<button class="success" onclick="sendCmd(\'turn_on\')">开</button>'
      + '<button class="danger" onclick="sendCmd(\'turn_off\')">关</button></div>'
      + '<div class="form-group"><label>自定义指令</label><div class="row">'
      + '<input id="customAction" placeholder="action" style="flex:1">'
      + '<input id="customParams" placeholder=\'参数JSON\' style="flex:1">'
      + '<button onclick="sendCmd(document.getElementById(\'customAction\').value,JSON.parse(document.getElementById(\'customParams\').value||\'{}\'  ))">发送</button>'
      + '</div></div>';
  }

  panel.innerHTML = html;
  document.getElementById('controlModal').classList.add('show');
}

async function sendCmd(action, params) {
  var deviceId = document.getElementById('controlDeviceId').value;
  var res = await fetch('/api/iot/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({device_id: deviceId, action: action, params: params || {}})
  });
  var data = await res.json();
  if (data.ok) {
    toast('指令已发送: ' + action);
    loadLogs();
  } else {
    toast(data.error || '发送失败', true);
  }
}

async function loadLogs() {
  var res = await fetch('/api/iot/logs');
  var data = await res.json();
  var tb = document.querySelector('#logTable tbody');
  if (!data.length) {
    tb.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center">暂无日志</td></tr>';
    return;
  }
  tb.innerHTML = data.map(function(l) {
    var resultCls = l.result === 'success' ? 'on' : l.result === 'fail' ? 'off' : '';
    var params = '-';
    try { if(l.params) params = l.params; } catch(e){}
    return '<tr>'
      + '<td class="muted">' + l.created_at + '</td>'
      + '<td>' + l.device_id + '</td>'
      + '<td><b>' + l.action + '</b></td>'
      + '<td style="font-size:11px">' + params + '</td>'
      + '<td><span class="tag ' + resultCls + '">' + l.result + '</span></td>'
      + '<td class="muted">' + l.source + '</td></tr>';
  }).join('');
}

loadDevices();
loadLogs();
</script>
<script src="/shared-nav.js"></script>
</body>
</html>
