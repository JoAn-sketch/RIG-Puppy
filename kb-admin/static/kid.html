<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>儿童题库 · 噜噜</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
header { background: #1f2937; color: #fff; padding: 14px 24px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin: 0; font-size: 18px; font-weight: 500; }
header a { color: #9ca3af; text-decoration: none; font-size: 13px; margin-left: 16px; }
header a:hover { color: #fff; }
main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; margin-bottom: 20px; }
h2 { margin: 0 0 14px; font-size: 15px; color: #374151; border-left: 3px solid #f59e0b; padding-left: 10px; }
button { background: #3b82f6; color: #fff; border: 0; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; }
button:hover { background: #2563eb; }
button.danger { background: #ef4444; }
button.ghost { background: #fff; color: #374151; border: 1px solid #d1d5db; }
button.success { background: #10b981; }
button.warning { background: #f59e0b; }
button:disabled { opacity: .4; cursor: not-allowed; }
input, select, textarea { font-size: 13px; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 5px; outline: none; width: 100%; }
textarea { resize: vertical; }
.muted { color: #9ca3af; font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.tag.on { background: #dcfce7; color: #166534; }
.tag.off { background: #fee2e2; color: #991b1b; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
th { background: #f9fafb; font-weight: 500; color: #6b7280; }
tr:hover td { background: #f9fafb; }
.toast { position: fixed; top: 20px; right: 20px; background: #10b981; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 200; display: none; }
.toast.error { background: #ef4444; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; justify-content:center; align-items:center; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 8px; padding: 24px; width: 480px; max-width: 95vw; }
.modal h3 { margin: 0 0 16px; font-size: 16px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-bar select, .filter-bar input { width: auto; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-bottom: 4px; }
.stat-box { background: #f9fafb; border-radius: 8px; padding: 12px; text-align: center; }
.stat-box .num { font-size: 24px; font-weight: 600; color: #1f2937; }
.stat-box .label { font-size: 11px; color: #9ca3af; margin-top: 2px; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header>
  <h1>🧒 儿童题库管理</h1>
  <div>
    <a href="/">📚 后端</a>
    <a href="/contacts">👥 联系人</a>
    <a href="/reminders">⏰ 提醒</a>
    <a href="/portrait">🧑 画像</a>
    <a href="/actions">🐕 动作</a>
    <a href="/kid" style="color:#fbbf24">🧒 儿童</a>
    <a href="/dingyi-models" style="color:#34d399">🤖 模型切换</a>
    <a href="/dingyi-chat" style="color:#f59e0b">💬 对话模拟</a>
    <a href="/settings">⚙️ 设置</a>
  </div>
</header>

<main>

  <!-- 模式开关 -->
  <div class="card">
    <h2>儿童模式开关</h2>
    <div class="row" style="gap:24px;flex-wrap:wrap">
      <label class="row" style="gap:8px;cursor:pointer">
        <span class="muted">儿童模式</span>
        <input type="checkbox" id="kidSwitch" onchange="saveKidSwitch()" style="width:auto">
        <span id="kidSwitchLabel" class="tag off">关闭</span>
      </label>
      <div class="row" style="gap:8px">
        <label class="muted">默认年龄段</label>
        <select id="ageBandSel" style="width:auto" onchange="saveAgeBand()">
          <option value="3-5">3-5 岁</option>
          <option value="6-8" selected>6-8 岁</option>
          <option value="9-12">9-12 岁</option>
        </select>
      </div>
    </div>
    <p class="muted" style="margin:10px 0 0">开启后丁一锅将对所有会话使用儿童人设和题库。关闭后恢复成人陪伴模式。</p>
  </div>

  <!-- 题库统计 -->
  <div class="card">
    <h2>题库统计</h2>
    <div class="stat-grid" id="statGrid">
      <div class="stat-box"><div class="num" id="statTotal">-</div><div class="label">全部题目</div></div>
    </div>
  </div>

  <!-- 题库列表 -->
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">题目列表</h2>
      <button onclick="openAdd()">＋ 添加题目</button>
    </div>
    <div class="filter-bar">
      <select id="filterType" onchange="loadList()">
        <option value="">全部题型</option>
        <option value="riddle">脑筋急转弯</option>
        <option value="math">数学</option>
        <option value="pinyin">拼音</option>
        <option value="idiom">成语</option>
        <option value="english">英语</option>
        <option value="safety">安全</option>
        <option value="whyq">十万个为什么</option>
      </select>
      <select id="filterAge" onchange="loadList()">
        <option value="">全部年龄</option>
        <option value="3-5">3-5 岁</option>
        <option value="6-8">6-8 岁</option>
        <option value="9-12">9-12 岁</option>
      </select>
      <select id="filterEnabled" onchange="loadList()">
        <option value="">全部状态</option>
        <option value="1">启用</option>
        <option value="0">禁用</option>
      </select>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>题型</th><th>题目</th><th>答案</th><th>年龄</th><th>奖励</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="8" style="text-align:center;color:#9ca3af">加载中…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 儿童画像 -->
  <div class="card">
    <h2>儿童学习画像</h2>
    <div id="profileArea" style="color:#9ca3af;font-size:13px">加载中…</div>
  </div>

</main>

<!-- 添加/编辑弹窗 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">添加题目</h3>
    <div class="form-row">
      <label>题型</label>
      <select id="fType">
        <option value="riddle">脑筋急转弯</option>
        <option value="math">数学</option>
        <option value="pinyin">拼音</option>
        <option value="idiom">成语</option>
        <option value="english">英语</option>
        <option value="safety">安全</option>
        <option value="whyq">十万个为什么</option>
      </select>
    </div>
    <div class="form-row">
      <label>题目</label>
      <textarea id="fQuestion" rows="3"></textarea>
    </div>
    <div class="form-row">
      <label>标准答案（模糊匹配，不要带%）</label>
      <input type="text" id="fAnswer">
    </div>
    <div class="form-row">
      <label>年龄段</label>
      <select id="fAge">
        <option value="3-5">3-5 岁</option>
        <option value="6-8" selected>6-8 岁</option>
        <option value="9-12">9-12 岁</option>
      </select>
    </div>
    <div class="row" style="gap:12px">
      <div style="flex:1">
        <label class="muted">答对奖励动作组</label>
        <input type="text" id="fReward" value="happy" style="margin-top:4px">
      </div>
      <div style="flex:1">
        <label class="muted">答错安抚动作组</label>
        <input type="text" id="fComfort" value="comfort" style="margin-top:4px">
      </div>
    </div>
    <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">
      <button class="ghost" onclick="closeModal()">取消</button>
      <button onclick="saveQuestion()" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
const TYPE_LABEL = {riddle:'脑筋急转弯',math:'数学',pinyin:'拼音',idiom:'成语',english:'英语',safety:'安全',whyq:'十万个为什么'};
let editId = null;

function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (err ? ' error' : '');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2800);
}

async function api(url, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  return r.json();
}

// ===== 开关 =====
async function loadConfig() {
  const rows = await api('/api/settings');
  const kv = Object.fromEntries(rows.map(r => [r.config_key, r.config_value]));
  const sw = document.getElementById('kidSwitch');
  sw.checked = kv.kid_mode_enabled === '1';
  document.getElementById('kidSwitchLabel').className = 'tag ' + (sw.checked ? 'on' : 'off');
  document.getElementById('kidSwitchLabel').textContent = sw.checked ? '开启' : '关闭';
  if (kv.kid_default_age_band) document.getElementById('ageBandSel').value = kv.kid_default_age_band;
}

async function saveKidSwitch() {
  const val = document.getElementById('kidSwitch').checked ? '1' : '0';
  document.getElementById('kidSwitchLabel').className = 'tag ' + (val==='1'?'on':'off');
  document.getElementById('kidSwitchLabel').textContent = val==='1'?'开启':'关闭';
  await api('/api/settings/kid_mode_enabled', 'PUT', {value: val});
  toast(val==='1' ? '儿童模式已开启' : '儿童模式已关闭');
}

async function saveAgeBand() {
  const val = document.getElementById('ageBandSel').value;
  await api('/api/settings/kid_default_age_band', 'PUT', {value: val});
  toast('默认年龄段已保存');
}

// ===== 统计 =====
async function loadStats() {
  const rows = await api('/api/kid/stats');
  const grid = document.getElementById('statGrid');
  document.getElementById('statTotal').textContent = rows.total || 0;
  // 按题型
  let extra = '';
  for (const [type, cnt] of Object.entries(rows.by_type || {})) {
    extra += `<div class="stat-box"><div class="num">${cnt}</div><div class="label">${TYPE_LABEL[type]||type}</div></div>`;
  }
  grid.innerHTML = `<div class="stat-box"><div class="num" id="statTotal">${rows.total||0}</div><div class="label">全部题目</div></div>` + extra;
}

// ===== 列表 =====
async function loadList() {
  const type = document.getElementById('filterType').value;
  const age = document.getElementById('filterAge').value;
  const enabled = document.getElementById('filterEnabled').value;
  let url = '/api/kid/questions?';
  if (type) url += `type=${type}&`;
  if (age) url += `age=${age}&`;
  if (enabled !== '') url += `enabled=${enabled}&`;

  const rows = await api(url);
  const body = document.getElementById('listBody');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#9ca3af">暂无数据</td></tr>';
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${TYPE_LABEL[r.content_type]||r.content_type}</td>
      <td style="max-width:260px;word-break:break-all">${r.question}</td>
      <td>${r.answer}</td>
      <td>${r.age_band}</td>
      <td>${r.reward_group}</td>
      <td><span class="tag ${r.enabled==='1'?'on':'off'}">${r.enabled==='1'?'启用':'禁用'}</span></td>
      <td class="row" style="gap:6px">
        <button class="ghost" style="padding:4px 10px" onclick='openEdit(${JSON.stringify(r)})'>编辑</button>
        <button class="${r.enabled==='1'?'warning':'success'}" style="padding:4px 10px" onclick="toggleEnabled(${r.id},${r.enabled==='1'?0:1})">${r.enabled==='1'?'禁用':'启用'}</button>
        <button class="danger" style="padding:4px 10px" onclick="deleteQ(${r.id})">删除</button>
      </td>
    </tr>
  `).join('');
}

// ===== 画像 =====
async function loadProfile() {
  const rows = await api('/api/kid/profiles');
  const el = document.getElementById('profileArea');
  if (!rows.length) { el.textContent = '暂无画像数据(等小朋友玩几天游戏后自动生成)'; return; }
  el.innerHTML = rows.map(r => {
    const p = r.profile_json ? JSON.parse(r.profile_json) : {};
    return `<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #e5e7eb">
      <div class="row" style="justify-content:space-between">
        <b style="font-size:13px">设备: ${r.device_mac}</b>
        <span class="muted">${r.updated_at}</span>
      </div>
      <div style="margin-top:8px;font-size:13px">${p.summary || '(无摘要)'}</div>
      ${p.encourage ? `<div style="margin-top:6px;color:#f59e0b;font-size:13px">💬 今日鼓励: ${p.encourage}</div>` : ''}
      <div style="margin-top:8px" class="muted">
        正确率 ${p.accuracy||0}% · 连对最高 ${p.best_streak||0} 题 · 活跃 ${p.active_days||0} 天
        ${p.fav_type ? `· 最爱 ${TYPE_LABEL[p.fav_type]||p.fav_type}` : ''}
        ${p.weak_type ? `· 待加强 ${TYPE_LABEL[p.weak_type]||p.weak_type}` : ''}
      </div>
    </div>`;
  }).join('');
}

// ===== 弹窗 =====
function openAdd() {
  editId = null;
  document.getElementById('modalTitle').textContent = '添加题目';
  ['fQuestion','fAnswer','fReward','fComfort'].forEach(id => document.getElementById(id).value = id.includes('Reward') ? 'happy' : id.includes('Comfort') ? 'comfort' : '');
  document.getElementById('fType').value = 'riddle';
  document.getElementById('fAge').value = '6-8';
  document.getElementById('modalBg').classList.add('open');
}

function openEdit(r) {
  editId = r.id;
  document.getElementById('modalTitle').textContent = '编辑题目 #' + r.id;
  document.getElementById('fType').value = r.content_type;
  document.getElementById('fQuestion').value = r.question;
  document.getElementById('fAnswer').value = r.answer;
  document.getElementById('fAge').value = r.age_band;
  document.getElementById('fReward').value = r.reward_group;
  document.getElementById('fComfort').value = r.comfort_group;
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

async function saveQuestion() {
  const body = {
    content_type: document.getElementById('fType').value,
    question: document.getElementById('fQuestion').value.trim(),
    answer: document.getElementById('fAnswer').value.trim(),
    age_band: document.getElementById('fAge').value,
    reward_group: document.getElementById('fReward').value.trim() || 'happy',
    comfort_group: document.getElementById('fComfort').value.trim() || 'comfort',
  };
  if (!body.question || !body.answer) { toast('题目和答案不能为空', true); return; }
  const url = editId ? `/api/kid/questions/${editId}` : '/api/kid/questions';
  const method = editId ? 'PUT' : 'POST';
  const r = await api(url, method, body);
  if (r.ok) { toast('保存成功'); closeModal(); loadList(); loadStats(); }
  else toast(r.error || '保存失败', true);
}

async function toggleEnabled(id, val) {
  const r = await api(`/api/kid/questions/${id}`, 'PUT', {enabled: val});
  if (r.ok) { toast(val ? '已启用' : '已禁用'); loadList(); }
  else toast(r.error || '操作失败', true);
}

async function deleteQ(id) {
  if (!confirm('确认删除这道题？')) return;
  const r = await api(`/api/kid/questions/${id}`, 'DELETE');
  if (r.ok) { toast('已删除'); loadList(); loadStats(); }
  else toast(r.error || '删除失败', true);
}

document.getElementById('modalBg').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });

// 初始化
loadConfig();
loadStats();
loadList();
loadProfile();
</script>
<script src="/shared-nav.js"></script>
</body>
</html>
